<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modo Barra / Modo Palito</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: #000; color: #fff;
      font-family: Arial, Helvetica, sans-serif; display: flex; align-items: center; justify-content: center;
      padding: 18px;
    }
    .panel { width: min(900px, 100%); background: #000; }
    .toolbar { display: flex; justify-content: flex-end; margin-bottom: 12px; }
    button {
      border: 0; border-radius: 8px; background: #1f77ff; color: white; font-weight: 700;
      padding: 12px 16px; cursor: pointer; font-size: 14px;
    }
    button:hover { background: #0d5ac1; }
    canvas { display: block; width: 100%; height: auto; background: #000; border-radius: 8px; }
    .note { color: #aaa; font-size: 12px; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="toolbar"><button id="toggle">A MODO PALITO</button></div>
    <canvas id="chart" width="900" height="560" aria-label="Gráfico interactivo"></canvas>
    <p class="note">Pulsa el botón para cambiar entre barras y palitos. Los valores se generan aleatoriamente.</p>
  </main>
  <script>
    // Versión HTML/JavaScript del gráfico original en Python.
    const N = 10;
    let values = makeValues();
    let mode = 'bar';
    const canvas = document.getElementById('chart');
    const ctx = canvas.getContext('2d');
    const toggle = document.getElementById('toggle');

    function makeValues() {
      return Array.from({ length: N }, () => Math.floor(Math.random() * 9) + 1);
    }

    function draw() {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);

      const left = 68, right = 28, top = 72, bottom = 66;
      const plotW = w - left - right, plotH = h - top - bottom;
      const maxY = mode === 'bar' ? 10 : 15;
      const blue = '#1f77ff';

      // Título
      ctx.fillStyle = '#fff'; ctx.font = 'bold 23px Arial'; ctx.textAlign = 'center';
      ctx.fillText(`Modo: ${mode} | val=[${values.join(', ')}]`, w / 2, 34);

      // Ejes y cuadrícula
      ctx.lineWidth = 1; ctx.strokeStyle = '#383838'; ctx.fillStyle = '#ddd';
      ctx.font = '14px Arial'; ctx.textAlign = 'right';
      for (let t = 0; t <= maxY; t += 5) {
        const y = top + plotH - (t / maxY) * plotH;
        ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(w - right, y); ctx.stroke();
        ctx.fillText(String(t), left - 12, y + 5);
      }
      ctx.strokeStyle = '#aaa';
      ctx.beginPath(); ctx.moveTo(left, top); ctx.lineTo(left, top + plotH); ctx.lineTo(w - right, top + plotH); ctx.stroke();

      const slot = plotW / N;
      values.forEach((v, i) => {
        const xCenter = left + slot * (i + 0.5);
        const y = top + plotH - (v / maxY) * plotH;
        if (mode === 'bar') {
          const barW = slot * 0.68;
          ctx.fillStyle = blue;
          ctx.fillRect(xCenter - barW / 2, y, barW, top + plotH - y);
        } else {
          // Equivalente visual al errorbar de Matplotlib: punto y barra de error ±v.
          const low = Math.max(0, v - v);
          const high = Math.min(maxY, v + v);
          const yLow = top + plotH - (low / maxY) * plotH;
          const yHigh = top + plotH - (high / maxY) * plotH;
          ctx.strokeStyle = blue; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(xCenter, yHigh); ctx.lineTo(xCenter, yLow); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(xCenter - 7, yHigh); ctx.lineTo(xCenter + 7, yHigh);
          ctx.moveTo(xCenter - 7, yLow); ctx.lineTo(xCenter + 7, yLow); ctx.stroke();
          ctx.fillStyle = blue; ctx.beginPath(); ctx.arc(xCenter, y, 5, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = '#ddd'; ctx.font = '13px Arial'; ctx.textAlign = 'center';
        ctx.fillText(String(i), xCenter, top + plotH + 24);
      });
    }

    toggle.addEventListener('click', () => {
      mode = mode === 'bar' ? 'palito' : 'bar';
      toggle.textContent = mode === 'bar' ? 'A MODO PALITO' : 'A MODO BARRA';
      values = makeValues();
      draw();
    });

    draw();
  </script>
</body>
</html>
